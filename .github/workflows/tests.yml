name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  uned-backup-scraper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uned-backup-scraper
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: uned-backup-scraper/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
