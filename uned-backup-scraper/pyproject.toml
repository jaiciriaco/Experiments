[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "uned-backup-scraper"
version = "1.9.0"
description = "Copia local de materiales accesibles desde una sesión propia de Campus UNED/Ágora"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jaime Ciriaco" }]
keywords = ["uned", "moodle", "backup", "playwright"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "playwright>=1.52,<2",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["ruff>=0.11,<1"]

[project.scripts]
uned-backup = "uned_backup.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = [
  "BLE001", # La aplicación registra y continúa ante fallos aislados del campus.
  "S110",   # Algunos timeouts opcionales no requieren elevar un error.
]
